      PUBLIC_EVIDENCE_SIGNING_KEY: ${PUBLIC_EVIDENCE_SIGNING_KEY:?PUBLIC_EVIDENCE_SIGNING_KEY is required}
      WIDGET_PREVIEW_SIGNING_KEY: ${WIDGET_PREVIEW_SIGNING_KEY:?WIDGET_PREVIEW_SIGNING_KEY is required}
      INTEGRATION_TOKEN_PEPPER: ${INTEGRATION_TOKEN_PEPPER:?INTEGRATION_TOKEN_PEPPER is required}
      INTEGRATION_TOKEN_LEGACY_PEPPER: ${INTEGRATION_TOKEN_LEGACY_PEPPER:-}
      INTEGRATION_SECRET_ENCRYPTION_KEY: ${INTEGRATION_SECRET_ENCRYPTION_KEY:?INTEGRATION_SECRET_ENCRYPTION_KEY is required}
      INTEGRATION_SECRET_LEGACY_ENCRYPTION_KEY: ${INTEGRATION_SECRET_LEGACY_ENCRYPTION_KEY:-}
      AI_GRPC_TARGET: ai-api:50051
      AI_GRPC_PLAINTEXT: ${AI_GRPC_PLAINTEXT:-false}
      AI_GRPC_CA_CERTIFICATE: /run/cacanode-grpc/ca.crt
      AI_GRPC_CLIENT_CERTIFICATE: /run/cacanode-grpc/spring-client.crt
      AI_GRPC_CLIENT_KEY: /run/cacanode-grpc/spring-client.key
      AI_GRPC_AUTHORITY_OVERRIDE: ${AI_GRPC_AUTHORITY_OVERRIDE:-ai-api}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY is required}
      EXPIRY_MINS: ${EXPIRY_MINS:-15}
      EXPIRY_DAYS: ${EXPIRY_DAYS:-30}
      PUBLIC_RATE_LIMIT_ENABLED: ${PUBLIC_RATE_LIMIT_ENABLED:-true}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-cacanode}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-}
      SEAWEEDFS_REGION: ${SEAWEEDFS_REGION:-us-east-1}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:?FROM_EMAIL is required}
      FROM_NAME: ${FROM_NAME:-CacaNode}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@cacanode.local}
      VERIFICATION_LINK: ${VERIFICATION_LINK:?VERIFICATION_LINK is required}
      LOGIN_2FA_LINK: ${LOGIN_2FA_LINK:?LOGIN_2FA_LINK is required}
      INVITATION_LINK: ${INVITATION_LINK:?INVITATION_LINK is required}
      LOGIN_2FA_BYPASS_EMAILS: ${LOGIN_2FA_BYPASS_EMAILS:-}
      VERIFICATION_RESEND_COOLDOWN_SECONDS: ${VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      MAX_VERIFICATION_RESEND_ATTEMPTS: ${MAX_VERIFICATION_RESEND_ATTEMPTS:-5}
      LOGIN_2FA_EXPIRY_MINUTES: ${LOGIN_2FA_EXPIRY_MINUTES:-15}
      MOBILE_LOGIN_2FA_EXPIRY_MINUTES: ${MOBILE_LOGIN_2FA_EXPIRY_MINUTES:-10}
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_WEBHOOK_URL: ${PAYOS_WEBHOOK_URL:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:?PAYOS_RETURN_URL is required}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:?PAYOS_CANCEL_URL is required}
      BILLING_SALES_URL: ${BILLING_SALES_URL:-mailto:sales@cacanode.com}
      BILLING_CATALOG_VERSION: ${BILLING_CATALOG_VERSION:-2026-07-23}
      HIRING_RESERVATION_TTL_HOURS: ${HIRING_RESERVATION_TTL_HOURS:-24}
      HIRING_RESERVATION_REAPER_MS: ${HIRING_RESERVATION_REAPER_MS:-300000}
    expose:
      - "8080"
    volumes:
      - ${GRPC_CERT_DIR:?GRPC_CERT_DIR is required}:/run/cacanode-grpc:ro
    networks:
      - default
      - control-plane
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
    mem_limit: ${BUSINESS_API_MEMORY_LIMIT:-1280m}
    cpus: ${BUSINESS_API_CPU_LIMIT:-1.5}

  clamav:
    image: clamav/clamav:1.4
    profiles: [recruitment]
    restart: unless-stopped
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  ai-api:
    build:
      context: ./rag-chatbot-fastapi
    restart: unless-stopped
    init: true
    environment:
      <<: *ai-environment
      WORKER_MODE: ${WORKER_MODE:-disabled}
      WORKER_KINDS: ${WORKER_KINDS:-document}
      READINESS_REQUIRE_MODELS: ${READINESS_REQUIRE_MODELS:-true}
    expose:
      - "8000"
      - "50051"
    volumes:
      - model_cache:/models
      - ${GRPC_CERT_DIR:?GRPC_CERT_DIR is required}:/run/cacanode-grpc:ro
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      graph-service:
        condition: service_healthy
      reranker-service:
        condition: service_started
      seaweedfs-s3:
        condition: service_started
    mem_limit: ${AI_API_MEMORY_LIMIT:-1536m}
    cpus: ${AI_API_CPU_LIMIT:-2.0}

  graph-service:
    build:
      context: ./rag-chatbot-fastapi
    restart: unless-stopped
    init: true
    command: ["python", "-m", "uvicorn", "app.graph_main:app", "--host", "0.0.0.0", "--port", "8010", "--workers", "1"]
    environment:
      <<: *ai-environment
    expose:
      - "8010"
    volumes:
      - kuzu_data:/data/kuzu
      - deployment_backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${GRAPH_MEMORY_LIMIT:-512m}
    cpus: ${GRAPH_CPU_LIMIT:-0.75}

  document-worker:
    <<: *document-worker
    command: ["python", "-m", "app.workers.runner", "document"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-1280m}
    cpus: ${OLLAMA_CPU_LIMIT:-1.5}

  reranker-service:
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    platform: ${RERANKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    command: ["--model-id", "${RERANKER_MODEL_ID:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"]
    environment:
      OMP_NUM_THREADS: ${RERANKER_THREADS:-2}
      MKL_NUM_THREADS: ${RERANKER_THREADS:-2}
    expose:
      - "80"
    volumes:
      - model_cache:/data
    shm_size: 256mb
    mem_limit: ${RERANKER_MEMORY_LIMIT:-1536m}
    cpus: ${RERANKER_CPU_LIMIT:-1.25}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cacanode}
      POSTGRES_USER: ${POSTGRES_USER:-cacanode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cacanode} -d ${POSTGRES_DB:-cacanode}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    networks:
      - control-plane

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_MAXMEMORY:-192mb}", "--maxmemory-policy", "noeviction"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rag_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-512m}
    cpus: ${RABBITMQ_CPU_LIMIT:-0.75}

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: ${QDRANT_MEMORY_LIMIT:-768m}
    cpus: ${QDRANT_CPU_LIMIT:-1.0}

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: master -mdir=/data
    expose:
      - "9333"
      - "19333"
    volumes:
      - seaweedfs_master:/data
    mem_limit: ${SEAWEEDFS_MASTER_MEMORY_LIMIT:-192m}
    cpus: ${SEAWEEDFS_MASTER_CPU_LIMIT:-0.35}

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -port=8080
    expose:
      - "8080"
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master
    mem_limit: ${SEAWEEDFS_VOLUME_MEMORY_LIMIT:-256m}
    cpus: ${SEAWEEDFS_VOLUME_CPU_LIMIT:-0.5}

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333
    expose:
      - "8888"
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      - seaweedfs-master
    mem_limit: ${SEAWEEDFS_FILER_MEMORY_LIMIT:-256m}
    cpus: ${SEAWEEDFS_FILER_CPU_LIMIT:-0.5}

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: s3 -filer=seaweedfs-filer:8888
    expose:
      - "8333"
    depends_on:
      - seaweedfs-filer
    mem_limit: ${SEAWEEDFS_S3_MEMORY_LIMIT:-192m}
    cpus: ${SEAWEEDFS_S3_CPU_LIMIT:-0.35}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  ollama_data:
  kuzu_data:
  model_cache:
  deployment_backups:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:

networks:
  control-plane:
    internal: true
