x-document-worker: &document-worker
  build:
    context: ./rag-chatbot-fastapi
  profiles: [dedicated-workers]
  restart: unless-stopped
  init: true
  environment:
    <<: *ai-environment
    WORKER_MODE: dedicated
    WORKER_KINDS: document
  depends_on:
    rabbitmq:
      condition: service_healthy
    qdrant:
      condition: service_started
    ollama:
      condition: service_healthy
    graph-service:
      condition: service_healthy
    seaweedfs-s3:
      condition: service_started
  volumes:
    - model_cache:/models
  mem_limit: ${DOCUMENT_WORKER_MEMORY_LIMIT:-1280m}
  cpus: ${DOCUMENT_WORKER_CPU_LIMIT:-1.5}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?DEPLOY_DOMAIN is required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPU_LIMIT:-0.5}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    depends_on:
      - admin-web
      - business-api
      - ai-api
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.5}

  admin-web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_WIDGET_URL: ${PUBLIC_WIDGET_URL:?PUBLIC_WIDGET_URL is required}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-vi-VN}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?NEXT_PUBLIC_TURNSTILE_SITE_KEY is required}
        NEXT_PUBLIC_RECRUITMENT_ENABLED: ${NEXT_PUBLIC_RECRUITMENT_ENABLED:-false}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    mem_limit: ${ADMIN_WEB_MEMORY_LIMIT:-512m}
    cpus: ${ADMIN_WEB_CPU_LIMIT:-0.75}

  business-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=20}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cacanode}
      POSTGRES_USER: ${POSTGRES_USER:-cacanode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_URL: redis://redis:6379/0
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      REDIS_OPERATION_TIMEOUT_SECONDS: ${REDIS_OPERATION_TIMEOUT_SECONDS:-1}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      CACHE_KEY_PREFIX: "${CACHE_KEY_PREFIX:-ccn:v1}"
      CACHE_TTL_JITTER_PERCENT: ${CACHE_TTL_JITTER_PERCENT:-10}
      INTEGRATION_TOKEN_CACHE_ENABLED: ${INTEGRATION_TOKEN_CACHE_ENABLED:-false}
      INTEGRATION_TOKEN_CACHE_TTL_SECONDS: ${INTEGRATION_TOKEN_CACHE_TTL_SECONDS:-60}
      BUSINESS_READ_CACHE_ENABLED: ${BUSINESS_READ_CACHE_ENABLED:-false}
