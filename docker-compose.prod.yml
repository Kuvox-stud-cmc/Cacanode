x-ai-environment: &ai-environment
  APP_ENV: ${APP_ENV:-development}
  TOKEN_KEY: ${TOKEN_KEY:-change-me-access}
  INTEGRATION_TOKEN_PEPPER: ${INTEGRATION_TOKEN_PEPPER:-change-me-integration-pepper}
  BUSINESS_API_BASE_URL: http://business-api:8080
  POSTGRES_URL: postgresql://${POSTGRES_USER:-cacanode}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cacanode}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://rag_user:rag_password@rabbitmq:5672/
  QDRANT_URL: http://qdrant:6333
  KUZU_DATABASE_PATH: /data/kuzu/cacanode.kuzu
  GRAPH_SERVICE_URL: http://graph-service:8010
  SEAWEEDFS_MASTER_URL: http://seaweedfs-master:9333
  SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8888
  SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
  SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-cacanode}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:-ollama}
  LLM_MODEL_ID: ${LLM_MODEL_ID:-gemma4:12b}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-128}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
  LLM_USE_OLLAMA_NATIVE_CHAT: ${LLM_USE_OLLAMA_NATIVE_CHAT:-true}
  LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-true}
  TEXT_EMBEDDING_BASE_URL: ${TEXT_EMBEDDING_BASE_URL:-http://ollama:11434}
  TEXT_EMBEDDING_MODEL_ID: ${TEXT_EMBEDDING_MODEL_ID:-embeddinggemma}
  TEXT_EMBEDDING_DIMENSION: ${TEXT_EMBEDDING_DIMENSION:-768}
  MIN_RETRIEVAL_CONFIDENCE: ${MIN_RETRIEVAL_CONFIDENCE:-0.35}

x-worker: &worker
  build:
    context: ./rag-chatbot-fastapi
  profiles: [workers]
  restart: unless-stopped
  environment:
    <<: *ai-environment
    WORKER_MODE: dedicated
  depends_on:
    rabbitmq:
      condition: service_healthy
    ollama:
      condition: service_healthy
  volumes:
    - kuzu_data:/data/kuzu
    - model_cache:/models

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-web
      - business-api
      - ai-api

  admin-web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_AI_API_BASE_URL: ${PUBLIC_AI_API_BASE_URL:-}
        NEXT_PUBLIC_DEMO_CHATBOT_ID: ${DEMO_CHATBOT_ID:-00000000-0000-0000-0000-000000000005}
        NEXT_PUBLIC_DEMO_KNOWLEDGE_BASE_ID: ${DEMO_KNOWLEDGE_BASE_ID:-00000000-0000-0000-0000-000000000004}
        NEXT_PUBLIC_WIDGET_URL: ${PUBLIC_WIDGET_URL:-http://localhost/widget/v1/cacanode-chat.js}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-vi-VN}
    restart: unless-stopped
    expose:
      - "3000"

  business-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cacanode}
      POSTGRES_USER: ${POSTGRES_USER:-cacanode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rag_user:rag_password@rabbitmq:5672/
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TOKEN_KEY: ${TOKEN_KEY:-change-me-access}
      INTEGRATION_TOKEN_PEPPER: ${INTEGRATION_TOKEN_PEPPER:-change-me-integration-pepper}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-change-me-webhook-key}
      EXPIRY_MINS: ${EXPIRY_MINS:-15}
      EXPIRY_DAYS: ${EXPIRY_DAYS:-30}
      AI_API_GRPC_ADDRESS: static://ai-api:50051
      GRPC_CERT_PATH: ${GRPC_CERT_PATH:-/run/secrets/grpc/tls.crt}
      GRPC_KEY_PATH: ${GRPC_KEY_PATH:-/run/secrets/grpc/tls.key}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-no-reply@cacanode.local}
      TEMPLATE_ID: ${TEMPLATE_ID:-}
    expose:
      - "8080"
      - "9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-api:
    build:
      context: ./rag-chatbot-fastapi
    restart: unless-stopped
    environment:
      <<: *ai-environment
      WORKER_MODE: ${WORKER_MODE:-embedded}
      READINESS_REQUIRE_MODELS: ${READINESS_REQUIRE_MODELS:-false}
    expose:
      - "8000"
    volumes:
      - kuzu_data:/data/kuzu
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy

  graph-service:
    build:
      context: ./rag-chatbot-fastapi
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.graph_main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      <<: *ai-environment
    expose:
      - "8010"
    volumes:
      - kuzu_data:/data/kuzu

  document-worker:
    <<: *worker
    command: ["python", "-m", "app.workers.runner", "document"]

  ocr-worker:
    <<: *worker
    command: ["python", "-m", "app.workers.runner", "ocr"]

  asr-worker:
    <<: *worker
    command: ["python", "-m", "app.workers.runner", "asr"]

  vision-worker:
    <<: *worker
    command: ["python", "-m", "app.workers.runner", "vision"]

  audio-worker:
    <<: *worker
    command: ["python", "-m", "app.workers.runner", "audio"]

  video-worker:
    <<: *worker
    command: ["python", "-m", "app.workers.runner", "video"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  llm-server:
    image: vllm/vllm-openai:latest
    profiles: [gpu]
    restart: unless-stopped
    command: ["--model", "${VLLM_MODEL_ID:-configure-a-hugging-face-model}", "--api-key", "${VLLM_API_KEY:-change-me}"]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${MODEL_REGISTRY_TOKEN:-}
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    profiles: [gpu]
    restart: unless-stopped
    command: ["--model-id", "${TEI_MODEL_ID:-google/embeddinggemma-300m}"]
    volumes:
      - model_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cacanode}
      POSTGRES_USER: ${POSTGRES_USER:-cacanode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cacanode} -d ${POSTGRES_DB:-cacanode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rag_user
      RABBITMQ_DEFAULT_PASS: rag_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: master -mdir=/data
    ports:
      - "9333:9333"
      - "19333:19333"
    volumes:
      - seaweedfs_master:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -port=8080
    ports:
      - "8123:8080"
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: s3 -filer=seaweedfs-filer:8888
    ports:
      - "8333:8333"
    depends_on:
      - seaweedfs-filer

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  ollama_data:
  kuzu_data:
  model_cache:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:
