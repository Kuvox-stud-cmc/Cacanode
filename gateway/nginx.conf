events {}

http {
    server_tokens off;

    upstream admin_web { server admin-web:3000; }
    upstream business_api { server business-api:8080; }
    upstream ai_api { server ai-api:8000; }

    server {
        listen 80;
        client_max_body_size 500m;

        location /api/v1/chat/ {
            proxy_pass http://business_api;
            proxy_http_version 1.1;
            include /etc/nginx/proxy-headers.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /api/v1/widget/chat/ {
            proxy_pass http://business_api;
            include /etc/nginx/proxy-headers.conf;
        }

        location /api/v1/external/chat/ {
            proxy_pass http://business_api;
            include /etc/nginx/proxy-headers.conf;
        }

        location /api/v1/ {
            proxy_pass http://business_api;
            include /etc/nginx/proxy-headers.conf;
        }

        location /health/ {
            proxy_pass http://ai_api;
            include /etc/nginx/proxy-headers.conf;
        }

        location = /actuator/health {
            proxy_pass http://business_api/actuator/health;
            include /etc/nginx/proxy-headers.conf;
        }

        location = /widget/v1/cacanode-chat.js {
            proxy_pass http://business_api/widget/widget.js;
            include /etc/nginx/proxy-headers.conf;
        }

        location /widget/ {
            proxy_pass http://business_api;
            include /etc/nginx/proxy-headers.conf;
        }

        location / {
            proxy_pass http://admin_web;
            include /etc/nginx/proxy-headers.conf;
        }
    }
}
