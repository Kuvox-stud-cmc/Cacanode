events {}

http {
    upstream admin_web { server admin-web:3000; }
    upstream business_api { server business-api:8080; }
    upstream ai_api { server ai-api:8000; }

    server {
        listen 80;
        client_max_body_size 500m;

        location /api/v1/chat/ {
            proxy_pass http://ai_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /api/v1/ingestion/ {
            proxy_pass http://ai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/ {
            proxy_pass http://business_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /health/ {
            proxy_pass http://ai_api;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /widget/v1/cacanode-chat.js {
            proxy_pass http://business_api/widget/widget.js;
        }

        location /widget/ {
            proxy_pass http://business_api;
        }

        location / {
            proxy_pass http://admin_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
