app:
  cors:
    allowed-origins:
      - "https://cacanode.com"
      - "https://www.cacanode.com"
  security:
    cookie-secure: ${COOKIE_SECURE:true}
    login-2fa-bypass-emails: ${LOGIN_2FA_BYPASS_EMAILS:}

spring:
  config:
    activate:
      on-profile: prod
  devtools:
    add-properties: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms
  rabbitmq:
    addresses: ${RABBITMQ_URL}
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
    from-email: ${FROM_EMAIL}
    template-id: ${TEMPLATE_ID}
    verification-link: ${VERIFICATION_LINK}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never

jwt:
  token-key: ${TOKEN_KEY}
  expiry-mins: ${EXPIRY_MINS:15}
  expiry-days: ${EXPIRY_DAYS:30}

grpc:
  server:
    port: 9090
    security:
      enabled: true                     # TLS in prod
      certificate-chain: file:${GRPC_CERT_PATH}
      private-key: file:${GRPC_KEY_PATH}
  client:
    fastapi-service:
      address: ${AI_API_GRPC_ADDRESS:static://ai-api:50051}
      negotiation-type: tls
