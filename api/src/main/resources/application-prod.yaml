app:
  cors:
    allowed-origins:
      - "https://cacanode.com"
      - "https://www.cacanode.com"

spring:
  config:
    activate:
      on-profile: prod
  devtools:
    add-properties: false
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
    from-email: ${FROM_EMAIL}
    template-id: ${TEMPLATE_ID}
    verification-link: ${VERIFICATION_LINK}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never

jwt:
  token-key: ${TOKEN_KEY}
  expiry-mins: ${EXPIRY_MINS:15}
  expiry-days: ${EXPIRY_DAYS:7}

grpc:
  server:
    port: 9090
    security:
      enabled: true                     # TLS in prod
      certificate-chain: file:${GRPC_CERT_PATH}
      private-key: file:${GRPC_KEY_PATH}
  client:
    fastapi-service:
      address: static://${FASTAPI_HOST:localhost}:50051
      negotiation-type: tls
