<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CacaNode Support</title>
    <link rel="stylesheet" href="/widget/widget.css">
</head>
<body>
<main id="widget" class="widget" data-open="false">
    <section class="panel" aria-label="Support conversation">
        <header class="header">
            <div class="header-identity">
                <span class="header-icon-shell" aria-hidden="true">
                    <img id="header-icon" class="widget-icon" alt="" hidden>
                    <span id="header-icon-fallback" class="icon-fallback" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.75h14a1.75 1.75 0 0 1 1.75 1.75v7A1.75 1.75 0 0 1 19 16.25h-7.2L7.2 19.7a.75.75 0 0 1-1.2-.6v-2.85H5a1.75 1.75 0 0 1-1.75-1.75v-7A1.75 1.75 0 0 1 5 5.75Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 10.75h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
                </span>
                <span class="header-copy">
                <strong id="display-name">Assistant</strong>
                <span>Online</span>
                </span>
            </div>
            <button id="close" class="icon-button" type="button" aria-label="Close chat">&#10005;</button>
        </header>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="composer" class="composer">
            <textarea id="message" rows="1" maxlength="32000" placeholder="Type a message" aria-label="Message"></textarea>
            <button id="send" type="submit" aria-label="Send message">&#10148;</button>
        </form>
        <div id="branding" class="branding" hidden>Powered by CacaNode</div>
    </section>
    <button id="launcher" class="launcher" type="button" aria-label="Open support chat">
        <img id="launcher-icon" class="widget-icon" alt="" hidden>
        <span id="launcher-icon-fallback" class="icon-fallback" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="M5 5.75h14a1.75 1.75 0 0 1 1.75 1.75v7A1.75 1.75 0 0 1 19 16.25h-7.2L7.2 19.7a.75.75 0 0 1-1.2-.6v-2.85H5a1.75 1.75 0 0 1-1.75-1.75v-7A1.75 1.75 0 0 1 5 5.75Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 10.75h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    </button>
</main>

<dialog id="ticket-dialog">
    <form id="ticket-form" method="dialog">
        <header>
            <strong>Create support ticket</strong>
            <button id="ticket-cancel" class="icon-button" type="button" aria-label="Close">&#10005;</button>
        </header>
        <label>Email<input id="ticket-email" type="email" maxlength="320" required></label>
        <label>Title<input id="ticket-title" maxlength="255" required></label>
        <label>Description<textarea id="ticket-description" rows="6" maxlength="10000" required></textarea></label>
        <button id="ticket-submit" class="primary" type="submit">Create ticket</button>
    </form>
</dialog>

<script>
(function () {
  "use strict";
  var token = null;
  var config = null;
  var sessionId = null;
  var parentOrigin = null;
  var currentDraft = null;
  var iconObjectUrl = null;
  var previewChatApiBaseUrl = null;
  var widget = document.getElementById("widget");
  var messages = document.getElementById("messages");
  var composer = document.getElementById("composer");
  var input = document.getElementById("message");
  var send = document.getElementById("send");
  var dialog = document.getElementById("ticket-dialog");

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({"Content-Type": "application/json", "Authorization": "Bearer " + token}, options.headers || {});
    if (parentOrigin) options.headers["X-Parent-Origin"] = parentOrigin;
    var url = path;
    if (previewChatApiBaseUrl && path.startsWith("/api/v1/widget/chat/")) {
      url = previewChatApiBaseUrl.replace(/\/$/, "") + path.slice("/api/v1".length);
    }
    return fetch(url, options).then(async function (response) {
      var body = response.status === 204 ? null : await response.json().catch(function () { return null; });
      if (!response.ok) {
        var message = body && body.error && body.error.message || body && body.message
          || body && body.detail || "Request failed";
        throw new Error(message);
      }
      return body;
    });
  }

  function apiBlob(path) {
    var headers = {"Authorization": "Bearer " + token};
    if (parentOrigin) headers["X-Parent-Origin"] = parentOrigin;
    return fetch(path, {headers: headers}).then(async function (response) {
      if (!response.ok) throw new Error("Unable to load widget icon");
      return response.blob();
    });
  }

  function setIconFallbackVisible(visible) {
    ["launcher-icon-fallback", "header-icon-fallback"].forEach(function (id) {
      var fallback = document.getElementById(id);
      fallback.hidden = !visible;
      fallback.style.display = visible ? "" : "none";
    });
  }

  function resetIcon(showFallback) {
    ["launcher-icon", "header-icon"].forEach(function (id) {
      var image = document.getElementById(id);
      image.removeAttribute("src");
      image.hidden = true;
    });
    setIconFallbackVisible(showFallback);
    if (iconObjectUrl) URL.revokeObjectURL(iconObjectUrl);
    iconObjectUrl = null;
  }

  async function loadIcon(path) {
    if (!path) return;
    setIconFallbackVisible(false);
    var objectUrl = null;
    try {
      var blob = path.startsWith("data:")
        ? await fetch(path).then(function (response) { return response.blob(); })
        : await apiBlob(path);
      objectUrl = URL.createObjectURL(blob);
      var images = [document.getElementById("launcher-icon"), document.getElementById("header-icon")];
      await Promise.all(images.map(function (image) {
        return new Promise(function (resolve, reject) {
          image.onload = resolve;
          image.onerror = reject;
          image.src = objectUrl;
        });
      }));
      if (iconObjectUrl) URL.revokeObjectURL(iconObjectUrl);
      iconObjectUrl = objectUrl;
      objectUrl = null;
      images.forEach(function (image) { image.hidden = false; });
      setIconFallbackVisible(false);
    } catch (error) {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      resetIcon(false);
    }
  }

  function safePublicUrl(value) {
    return typeof value === "string" && /^https?:\/\//i.test(value) ? value : null;
  }

  function appendMessageContent(item, content, citations) {
    var byId = new Map();
    (citations || []).forEach(function (citation) {
      byId.set(String(citation.id || "").toUpperCase(), citation);
    });
    var pattern = /\[S\d+\]/gi;
    var cursor = 0;
    var match;
    while ((match = pattern.exec(content)) !== null) {
      if (match.index > cursor) item.appendChild(document.createTextNode(content.slice(cursor, match.index)));
      var id = match[0].slice(1, -1).toUpperCase();
      var citation = byId.get(id);
      var publicUrl = citation && safePublicUrl(citation.public_url || citation.publicUrl);
      if (citation && publicUrl) {
        var link = document.createElement("a");
        link.className = "citation-link";
        link.href = publicUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = citation.id;
        link.title = "Open source: " + citation.source_name;
        item.appendChild(link);
      } else {
        item.appendChild(document.createTextNode(match[0]));
      }
      cursor = pattern.lastIndex;
    }
    if (cursor < content.length) item.appendChild(document.createTextNode(content.slice(cursor)));
  }

  function appendSourceCards(item, citations) {
    var sources = new Map();
    (citations || []).forEach(function (citation) {
      var publicUrl = safePublicUrl(citation.public_url || citation.publicUrl);
      if (!publicUrl || sources.has(citation.document_id)) return;
      sources.set(citation.document_id, {url: publicUrl, name: citation.source_name || "Source document"});
    });
    if (sources.size === 0) return;
    var container = document.createElement("div");
    container.className = "message-sources";
    var label = document.createElement("div");
    label.className = "message-sources-label";
    label.textContent = "Sources";
    container.appendChild(label);
    sources.forEach(function (source) {
      var link = document.createElement("a");
      link.className = "source-card";
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      var name = document.createElement("span");
      name.textContent = source.name;
      var arrow = document.createElement("span");
      arrow.textContent = "↗";
      link.appendChild(name);
      link.appendChild(arrow);
      container.appendChild(link);
    });
    item.appendChild(container);
  }

  function addMessage(role, content, citations) {
    var item = document.createElement("div");
    item.className = "message " + role;
    appendMessageContent(item, content, citations || []);
    if (role === "assistant") appendSourceCards(item, citations || []);
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
  }

  function setOpen(open) {
    widget.dataset.open = open ? "true" : "false";
    parent.postMessage({source: "cacanode-widget", type: "resize", open: open}, parentOrigin || "*");
    if (open) input.focus();
  }

  function applyConfig(nextConfig) {
    config = nextConfig;
    previewChatApiBaseUrl = config.previewChatApiBaseUrl || null;
    document.getElementById("display-name").textContent = config.displayName;
    document.documentElement.style.setProperty("--primary", config.primaryColor);
    document.getElementById("branding").hidden = !config.showCacanodeBranding;
    widget.dataset.iconStyle = config.iconStyle || "STANDARD";
    if (config.iconUrl) void loadIcon(config.iconUrl);
    else resetIcon(!config.hasCustomIcon);
    parent.postMessage({source: "cacanode-widget", type: "position", position: config.position}, parentOrigin);
  }

  async function initialize(incomingToken, origin, previewConfig) {
    token = incomingToken;
    parentOrigin = origin;
    try {
      applyConfig(previewConfig || await api("/api/v1/public/widget/config", {headers: {"X-Parent-Origin": parentOrigin}}));
      addMessage("assistant", config.welcomeMessage);
      var visitorKey = "cacanode-visitor:" + parentOrigin;
      var visitorId = localStorage.getItem(visitorKey);
      if (!visitorId) {
        visitorId = "visitor_" + crypto.randomUUID().replaceAll("-", "").slice(0, 12);
        localStorage.setItem(visitorKey, visitorId);
      }
      var session = await api("/api/v1/widget/chat/sessions", {
        method: "POST",
        body: JSON.stringify({external_user_id: visitorId, locale: navigator.language || "en"})
      });
      sessionId = session.id;
    } catch (error) {
      addMessage("error", error.message || "The support widget is unavailable.");
      input.disabled = true;
      send.disabled = true;
    }
  }

  window.addEventListener("message", function (event) {
    if (event.source !== parent || !event.data || event.data.source !== "cacanode-host") return;
    if (event.data.type === "preview-config" && token && event.data.config) {
      applyConfig(event.data.config);
      return;
    }
    if (event.data.type !== "init" || token) return;
    initialize(event.data.token, event.origin, event.data.previewConfig);
  });
  window.addEventListener("unload", function () { resetIcon(false); });

  document.getElementById("launcher").addEventListener("click", function () { setOpen(true); });
  document.getElementById("close").addEventListener("click", function () { setOpen(false); });

  composer.addEventListener("submit", async function (event) {
    event.preventDefault();
    var content = input.value.trim();
    if (!content || !sessionId || send.disabled) return;
    addMessage("user", content);
    input.value = "";
    send.disabled = true;
    try {
      var response = await api("/api/v1/widget/chat/sessions/" + sessionId + "/messages", {
        method: "POST",
        body: JSON.stringify({content: content})
      });
      addMessage("assistant", response.content, response.citations || []);
      if (response.action && response.action.type === "ticket_draft") {
        currentDraft = response.action;
        var draftEmail = response.action.customer_email || response.action.customerEmail || "";
        if (draftEmail) document.getElementById("ticket-email").value = draftEmail;
        document.getElementById("ticket-title").value = response.action.title;
        document.getElementById("ticket-description").value = response.action.description;
        dialog.showModal();
      }
    } catch (error) {
      addMessage("error", error.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  document.getElementById("ticket-cancel").addEventListener("click", function () { dialog.close(); });
  document.getElementById("ticket-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var button = document.getElementById("ticket-submit");
    button.disabled = true;
    try {
      var ticket = await api("/api/v1/external/tickets", {
        method: "POST",
        headers: {"Idempotency-Key": crypto.randomUUID()},
        body: JSON.stringify({
          sessionId: sessionId,
          customerEmail: document.getElementById("ticket-email").value,
          title: document.getElementById("ticket-title").value,
          description: document.getElementById("ticket-description").value
        })
      });
      dialog.close();
      addMessage("assistant", "Ticket " + ticket.id.slice(0, 8) + " was created. We will follow up by email.");
      currentDraft = null;
    } catch (error) {
      addMessage("error", error.message);
      dialog.close();
    } finally {
      button.disabled = false;
    }
  });

  parent.postMessage({source: "cacanode-widget", type: "ready"}, "*");
})();
</script>
</body>
</html>
