# Local frontend + Swagger/UI: localhost and 127.0.0.1 are different origins.
# Patterns allow any dev port (Next, Vite, CRA) and API/docs on :8080.
app:
  cors:
    allowed-origin-patterns:
      - ${ALLOWED_ORIGIN_PATTERN_1:http://localhost:*}
      - ${ALLOWED_ORIGIN_PATTERN_2:http://127.0.0.1:*}
  security:
    cookie-secure: ${COOKIE_SECURE:false}
    login-2fa-bypass-emails: ${LOGIN_2FA_BYPASS_EMAILS:admin@cacanode.local}
  seaweedfs:
    s3-endpoint: ${SEAWEEDFS_S3_ENDPOINT:http://localhost:18333}
    bucket: ${SEAWEEDFS_BUCKET:cacanode}
    access-key: ${SEAWEEDFS_ACCESS_KEY:}
    secret-key: ${SEAWEEDFS_SECRET_KEY:}
    region: ${SEAWEEDFS_REGION:us-east-1}
  email:
    from-email: ${FROM_EMAIL}
    from-name: ${FROM_NAME:CacaNode}
    verification-link: ${VERIFICATION_LINK:http://localhost:3000/verify-email}
    login-2fa-link: ${LOGIN_2FA_LINK:http://localhost:3000/verify-login}
    invitation-link: ${INVITATION_LINK:http://localhost:3000/accept-invitation}
  integrations:
    token-pepper: ${INTEGRATION_TOKEN_PEPPER:development-integration-token-pepper}
    legacy-token-pepper: ${INTEGRATION_TOKEN_LEGACY_PEPPER:development-integration-token-pepper}
    secret-encryption-key: ${INTEGRATION_SECRET_ENCRYPTION_KEY:development-integration-secret-encryption-key}
    legacy-secret-encryption-key: ${INTEGRATION_SECRET_LEGACY_ENCRYPTION_KEY:development-integration-secret-encryption-key}
  ai:
    grpc:
      target: ${AI_GRPC_TARGET:localhost:50051}
      plaintext: ${AI_GRPC_PLAINTEXT:true}
      answer-deadline-seconds: ${AI_ANSWER_DEADLINE_SECONDS:100}
      document-units-deadline-seconds: ${AI_DOCUMENT_UNITS_DEADLINE_SECONDS:10}
      deletion-deadline-seconds: ${AI_DELETION_DEADLINE_SECONDS:15}
      interview-deadline-seconds: ${AI_INTERVIEW_DEADLINE_SECONDS:10}
  webhooks:
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY:development-webhook-encryption-key}
    allow-private-networks: true
  billing:
    payos-enabled: ${PAYOS_ENABLED:false}
    catalog-version: ${BILLING_CATALOG_VERSION:2026-07-23}
    frontend-return-url: ${PAYOS_RETURN_URL:http://localhost:3000/settings?tab=quota&payment=return}
    frontend-cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/settings?tab=quota&payment=cancel}
    sales-url: ${BILLING_SALES_URL:mailto:sales@cacanode.com}
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}

spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:16379/0}
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://rag_user:rag_password@localhost:15673/}
    publisher-confirm-type: correlated
    publisher-returns: true
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
    from-email: ${FROM_EMAIL}
    verification-link: ${VERIFICATION_LINK:http://localhost:3000/verify-email}
    login-2fa-link: ${LOGIN_2FA_LINK:http://localhost:3000/verify-login}
    support-email: ${SUPPORT_EMAIL:support@cacanode.com}
    verification-resend-cooldown-seconds: ${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    max-verification-resend-attempts: ${MAX_VERIFICATION_RESEND_ATTEMPTS:5}
    login-2fa-expiry-minutes: ${LOGIN_2FA_EXPIRY_MINUTES:15}
    mobile-login-2fa-expiry-minutes: ${MOBILE_LOGIN_2FA_EXPIRY_MINUTES:10}
  brevo:
    api-key: ${BREVO_API_KEY:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  packages-to-scan: com.cacanode.api

openapi:
  service:
    api-docs: api
    server: http://localhost:${server.port}
    title: CacaNode API
    version: 1.0.0

jwt:
  token-key: ${TOKEN_KEY}
  expiry-mins: ${EXPIRY_MINS:15}
  expiry-days: ${EXPIRY_DAYS:30}
