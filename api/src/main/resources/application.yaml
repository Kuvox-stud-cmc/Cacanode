server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cacanode-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # net.devh grpc-spring-boot-starter 3.1.x targets Spring Security 5/6; Spring Boot 4 uses Security 7
  # where AccessDecisionManager was removed → GrpcServerSecurityAutoConfiguration cannot load.
  # gRPC auth is off in yaml (grpc.server.security.enabled: false); exclude broken autoconfig.
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    root: INFO
    web: INFO
