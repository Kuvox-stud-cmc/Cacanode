syntax = "proto3";

package cacanode.ingestion;

option java_package = "com.cacanode.api.grpc.ingestion";
option java_outer_classname = "IngestionProto";
option java_multiple_files = true;

// Called by Spring Boot -> FastAPI
// After document upload accepted, Spring Boot triggers ingestion

service IngestionService {
  rpc TriggerIngestion (IngestionRequest) returns (IngestionResponse);
  rpc GetIngestionStatus (StatusRequest) returns (StatusResponse);
  rpc DeleteDocument (DeleteRequest) returns (DeleteResponse);
}

message IngestionRequest {
  string tenant_id = 1;
  string document_id = 2;
  string file_path = 3;
  string file_type = 4;
  string file_name = 5;
}

message IngestionResponse {
  string job_id = 1;
  string status = 2;
}

message StatusRequest {
  string job_id = 1;
  string tenant_id = 2;
}

message StatusResponse {
  string job_id = 1;
  string status = 2;
  string error_message = 3;
  int32 chunk_count = 4;
}

message DeleteRequest {
  string tenant_id = 1;
  string document_id = 2;
}

message DeleteResponse {
  bool success = 1;
}