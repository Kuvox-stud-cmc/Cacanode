syntax = "proto3";

package cacanode.ai.v1;

option java_multiple_files = true;
option java_package = "com.cacanode.ai.v1";
option java_outer_classname = "CacanodeAiProto";

service InferenceService {
  rpc GenerateAnswer(GenerateAnswerRequest) returns (GenerateAnswerResponse);
  rpc ListDocumentUnits(ListDocumentUnitsRequest) returns (ListDocumentUnitsResponse);
  rpc DeleteDocumentIndex(DeleteDocumentIndexRequest) returns (DeleteDocumentIndexResponse);
  rpc PrepareInterviewSession(PrepareInterviewSessionRequest) returns (PrepareInterviewSessionResponse);
  rpc CancelInterviewSession(CancelInterviewSessionRequest) returns (CancelInterviewSessionResponse);
}

enum VisibilityMode {
  VISIBILITY_MODE_UNSPECIFIED = 0;
  ALL_TENANT_DOCUMENTS = 1;
  CUSTOMER_VISIBLE_DOCUMENTS = 2;
}

message PriorMessage {
  string role = 1;
  string content = 2;
}

message TraceMetadata {
  string request_id = 1;
  string trace_id = 2;
  string parent_span_id = 3;
  map<string, string> baggage = 4;
}

message GenerateAnswerRequest {
  string generation_id = 1;
  string turn_id = 2;
  string tenant_id = 3;
  string chatbot_id = 4;
  string knowledge_base_id = 5;
  int64 authoritative_revision = 6;
  string channel = 7;
  string locale = 8;
  string question = 9;
  repeated PriorMessage prior_messages = 10;
  string tenant_name = 11;
  string customer_answer_prompt = 12;
  VisibilityMode visibility_mode = 13;
  repeated string visible_document_ids = 14;
  string prompt_schema_version = 15;
  TraceMetadata trace = 16;
}

message Citation {
  string id = 1;
  string document_id = 2;
  string source_name = 3;
  optional int32 page_number = 4;
  int32 chunk_index = 5;
  double score = 6;
  string snippet = 7;
  optional string unit_id = 8;
  optional string modality = 9;
  repeated string section_path = 10;
  optional string block_type = 11;
  optional string sheet_name = 12;
  optional string cell_range = 13;
  optional string table_id = 14;
}

message TicketDraft {
  string title = 1;
  string description = 2;
  string customer_email = 3;
  map<string, string> metadata = 4;
}

message GenerateAnswerResponse {
  string generation_id = 1;
  int64 authoritative_revision = 2;
  string answer = 3;
  repeated Citation citations = 4;
  optional TicketDraft ticket_draft = 5;
  optional int64 input_tokens = 6;
  optional int64 output_tokens = 7;
  string cache_tier = 8;
  optional int64 avoided_input_tokens = 9;
  optional int64 avoided_output_tokens = 10;
}

message ListDocumentUnitsRequest {
  string tenant_id = 1;
  string knowledge_base_id = 2;
  string document_id = 3;
  TraceMetadata trace = 4;
}

message DocumentUnit {
  optional string unit_id = 1;
  int32 chunk_index = 2;
  string text = 3;
  optional string source_name = 4;
  optional string modality = 5;
  optional string block_type = 6;
  repeated string section_path = 7;
  optional string heading_context = 8;
  optional int32 page_number = 9;
  optional string sheet_name = 10;
  optional string cell_range = 11;
  optional string table_id = 12;
  optional int32 source_start = 13;
  optional int32 source_end = 14;
}

message ListDocumentUnitsResponse {
  repeated DocumentUnit units = 1;
}

message DeleteDocumentIndexRequest {
  string tenant_id = 1;
  string knowledge_base_id = 2;
  string document_id = 3;
  TraceMetadata trace = 4;
}

message DeleteDocumentIndexResponse {
  bool deleted = 1;
}

enum InterviewSectionKind {
  INTERVIEW_SECTION_KIND_UNSPECIFIED = 0;
  INTERVIEW_SECTION_KIND_CORE = 1;
  INTERVIEW_SECTION_KIND_ENGLISH_SCREEN = 2;
}

enum InterviewQuestionSource {
  INTERVIEW_QUESTION_SOURCE_UNSPECIFIED = 0;
  INTERVIEW_QUESTION_SOURCE_TEMPLATE = 1;
  INTERVIEW_QUESTION_SOURCE_CV_PERSONALIZED = 2;
}

message InterviewQuestionSnapshot {
  string question_id = 1;
  int32 position = 2;
  string prompt = 3;
  string competency = 4;
  string rubric = 5;
  int32 follow_up_limit = 6;
  InterviewQuestionSource source = 7;
  optional string evidence = 8;
}

message InterviewSectionSnapshot {
  string section_id = 1;
  int32 position = 2;
  InterviewSectionKind kind = 3;
  string language_tag = 4;
  int32 duration_limit_seconds = 5;
  string transition_text = 6;
  repeated InterviewQuestionSnapshot questions = 7;
}

message InterviewInteractionLimits {
  int32 repetition_limit = 1;
  int32 clarification_limit = 2;
  int32 silence_timeout_seconds = 3;
  int32 silence_prompt_limit = 4;
}

message PrepareInterviewSessionRequest {
  string session_id = 1;
  string call_attempt_id = 2;
  string tenant_id = 3;
  string template_revision_id = 4;
  string snapshot_version = 5;
  string snapshot_sha256 = 6;
  string company_display_name = 7;
  string candidate_display_name = 8;
  string introduction_text = 9;
  string disclosure_text = 10;
  string closing_text = 11;
  int32 duration_limit_seconds = 12;
  InterviewInteractionLimits interaction_limits = 13;
  bool recording_enabled = 14;
  bool cv_personalization_enabled = 15;
  repeated InterviewSectionSnapshot sections = 16;
  TraceMetadata trace = 17;
}

message PrepareInterviewSessionResponse {
  string session_id = 1;
  string call_attempt_id = 2;
  string runtime_token = 3;
  int64 expires_at_epoch_seconds = 4;
  string accepted_snapshot_sha256 = 5;
}

message CancelInterviewSessionRequest {
  string session_id = 1;
  string call_attempt_id = 2;
  string reason = 3;
  TraceMetadata trace = 4;
}

message CancelInterviewSessionResponse {
  string session_id = 1;
  string call_attempt_id = 2;
  bool cancelled = 3;
  bool already_terminal = 4;
}
