  ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-60}
  USER_DIRECTORY_CACHE_ENABLED: ${USER_DIRECTORY_CACHE_ENABLED:-false}
  USER_DIRECTORY_CACHE_TTL_SECONDS: ${USER_DIRECTORY_CACHE_TTL_SECONDS:-30}
  DOCUMENT_LIST_CACHE_ENABLED: ${DOCUMENT_LIST_CACHE_ENABLED:-false}
