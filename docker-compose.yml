  INTERVIEW_UTTERANCE_MAX_SECONDS: ${INTERVIEW_UTTERANCE_MAX_SECONDS:-90}
  INTERVIEW_MIN_QUESTION_WINDOW_SECONDS: ${INTERVIEW_MIN_QUESTION_WINDOW_SECONDS:-10}
  INTERVIEW_CLOSING_RESERVE_SECONDS: ${INTERVIEW_CLOSING_RESERVE_SECONDS:-10}
  INTERVIEW_SPEECH_ENERGY_THRESHOLD: ${INTERVIEW_SPEECH_ENERGY_THRESHOLD:-500}
  INTERVIEW_END_OF_UTTERANCE_SILENCE_MS: ${INTERVIEW_END_OF_UTTERANCE_SILENCE_MS:-3000}
  INTERVIEW_TTS_OUTPUT_GAIN_DB: ${INTERVIEW_TTS_OUTPUT_GAIN_DB:-0}
  INTERVIEW_RUNTIME_TOKEN_SECRET: ${INTERVIEW_RUNTIME_TOKEN_SECRET:-}
  INTERVIEW_RUNTIME_TOKEN_TTL_SECONDS: ${INTERVIEW_RUNTIME_TOKEN_TTL_SECONDS:-900}
  INTERVIEW_GLOBAL_CONCURRENCY: ${INTERVIEW_GLOBAL_CONCURRENCY:-10}
  INTERVIEW_TENANT_CONCURRENCY: ${INTERVIEW_TENANT_CONCURRENCY:-2}
  INTERVIEW_SESSION_LEASE_SECONDS: ${INTERVIEW_SESSION_LEASE_SECONDS:-30}
  INTERVIEW_SESSION_HEARTBEAT_SECONDS: ${INTERVIEW_SESSION_HEARTBEAT_SECONDS:-10}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_MEDIA_STREAM_WSS_URL: ${TWILIO_MEDIA_STREAM_WSS_URL:-}
  CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
  CARTESIA_STT_MODEL: ${CARTESIA_STT_MODEL:-ink-whisper-2025-06-04}
  CARTESIA_TTS_MODEL: ${CARTESIA_TTS_MODEL:-sonic-3.5-2026-05-04}
  CARTESIA_API_VERSION: ${CARTESIA_API_VERSION:-2026-03-01}
  CARTESIA_ENGLISH_VOICE_ID: ${CARTESIA_ENGLISH_VOICE_ID:-}
  CARTESIA_VIETNAMESE_VOICE_ID: ${CARTESIA_VIETNAMESE_VOICE_ID:-}
  CV_ANALYSIS_POLICY_VERSION: ${CV_ANALYSIS_POLICY_VERSION:-cv-redaction-fit-v2}
  CV_ANALYSIS_MODEL_VERSION: ${CV_ANALYSIS_MODEL_VERSION:-resume-analysis-v2}
  CV_ANALYSIS_MAX_EXTRACTED_CHARACTERS: ${CV_ANALYSIS_MAX_EXTRACTED_CHARACTERS:-50000}
  CV_ANALYSIS_MAX_EVIDENCE_SEGMENTS: ${CV_ANALYSIS_MAX_EVIDENCE_SEGMENTS:-250}
  CV_ANALYSIS_MAX_PERSONALIZED_QUESTIONS: ${CV_ANALYSIS_MAX_PERSONALIZED_QUESTIONS:-2}
  CV_ANALYSIS_MAX_PROCESSING_ATTEMPTS: ${CV_ANALYSIS_MAX_PROCESSING_ATTEMPTS:-3}
  CV_ANALYSIS_PENDING_OUTCOME_TTL_SECONDS: ${CV_ANALYSIS_PENDING_OUTCOME_TTL_SECONDS:-900}
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_units_v2}
  QDRANT_DENSE_VECTOR_NAME: ${QDRANT_DENSE_VECTOR_NAME:-text_embeddinggemma_v1}
  QDRANT_SPARSE_VECTOR_NAME: ${QDRANT_SPARSE_VECTOR_NAME:-text_bm25_v1}
  KUZU_DATABASE_PATH: /data/kuzu/cacanode.kuzu
  GRAPH_SERVICE_URL: http://graph-service:8010
  GRAPH_INTERNAL_TOKEN: ${GRAPH_INTERNAL_TOKEN:-development-graph-token}
  SEAWEEDFS_MASTER_URL: http://seaweedfs-master:9333
  SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8888
  SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
  SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-cacanode}
  SEAWEEDFS_CONNECT_TIMEOUT_SECONDS: ${SEAWEEDFS_CONNECT_TIMEOUT_SECONDS:-3}
  SEAWEEDFS_READ_TIMEOUT_SECONDS: ${SEAWEEDFS_READ_TIMEOUT_SECONDS:-30}
  SEAWEEDFS_MAX_ATTEMPTS: ${SEAWEEDFS_MAX_ATTEMPTS:-3}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:-ollama}
  LLM_MODEL_ID: ${LLM_MODEL_ID:-gemma4:12b}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-128}
  GRAPH_EXTRACTION_MAX_OUTPUT_TOKENS: ${GRAPH_EXTRACTION_MAX_OUTPUT_TOKENS:-4096}
  GRAPH_EXTRACTION_BATCH_SIZE: ${GRAPH_EXTRACTION_BATCH_SIZE:-4}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
  LLM_USE_OLLAMA_NATIVE_CHAT: ${LLM_USE_OLLAMA_NATIVE_CHAT:-true}
  LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-true}
  TEXT_EMBEDDING_BASE_URL: ${TEXT_EMBEDDING_BASE_URL:-http://ollama:11434}
  TEXT_EMBEDDING_MODEL_ID: ${TEXT_EMBEDDING_MODEL_ID:-embeddinggemma}
  TEXT_EMBEDDING_DIMENSION: ${TEXT_EMBEDDING_DIMENSION:-768}
  TEXT_EMBEDDING_TIMEOUT_SECONDS: ${TEXT_EMBEDDING_TIMEOUT_SECONDS:-120}
  SPARSE_MODEL_ID: ${SPARSE_MODEL_ID:-Qdrant/bm25}
  SPARSE_MODEL_CACHE_DIR: /models/fastembed
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
  RERANKER_URL: ${RERANKER_URL:-http://reranker-service}
  RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cacanode}
      POSTGRES_USER: ${POSTGRES_USER:-cacanode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cacanode} -d ${POSTGRES_DB:-cacanode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rag_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rag_password}
    ports:
      - "${RABBITMQ_PORT:-15673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-25672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-16333}:6333"
      - "${QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  graph-service:
    build:
      context: ./rag-chatbot-fastapi
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.graph_main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      <<: *local-environment
    ports:
      - "${GRAPH_SERVICE_PORT:-8010}:8010"
    volumes:
      - kuzu_data:/data/kuzu

  reranker-service:
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    platform: ${RERANKER_PLATFORM:-linux/amd64}
    profiles: [reranker]
    restart: unless-stopped
    command: ["--model-id", "${LOCAL_RERANKER_MODEL_ID:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"]
    ports:
      - "${RERANKER_PORT:-8082}:80"
    volumes:
      - model_cache:/data

  clamav:
    image: clamav/clamav:1.4
    profiles: [recruitment]
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-13310}:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: master -mdir=/data
    ports:
      - "${SEAWEEDFS_MASTER_PORT:-19334}:9333"
      - "${SEAWEEDFS_MASTER_GRPC_PORT:-29333}:19333"
    volumes:
      - seaweedfs_master:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://seaweedfs-master:9333/cluster/status"]
      interval: 3s
      timeout: 2s
      retries: 20

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -port=8080
    ports:
      - "${SEAWEEDFS_VOLUME_PORT:-18123}:8080"
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://seaweedfs-volume:8080/status"]
      interval: 3s
      timeout: 2s
      retries: 20

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333
    ports:
      - "${SEAWEEDFS_FILER_PORT:-18888}:8888"
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://seaweedfs-filer:8888/"]
      interval: 3s
      timeout: 2s
      retries: 20

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: s3 -filer=seaweedfs-filer:8888
    ports:
      - "${SEAWEEDFS_S3_PORT:-18333}:8333"
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://seaweedfs-s3:8333/"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  ollama_data:
  kuzu_data:
  model_cache:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:
